services:
  - type: web
    name: qr-platform-backend
    env: docker
    plan: free # Explicitly setting this can help validation
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false